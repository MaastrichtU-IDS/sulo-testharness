id: value-quality-unit
description: >-
  Competency question: recover the measurement's value, the quality
  it refers to, and its unit together in one query over the
  materialised store. This is the executable form of the paper's
  "predictable location for data values" claim: value via hasValue,
  quality via refersTo, unit via hasPart, on one fixed shape, with no
  reasoning required at query time beyond what materialize already
  closed.
data: data/measurement.ttl
prefixes:
  ex: http://example.org/
  obo: http://purl.obolibrary.org/obo/
cq:
  - query: queries/value-quality-unit.rq
    expect_rows:
      - { value: '"170"^^xsd:decimal', quality: "ex:height-quality", unit: "ex:unit" }
    exact: true
    ordered: false
tags: [pattern, solid, cq]

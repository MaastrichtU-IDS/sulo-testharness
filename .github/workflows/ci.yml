# The branch's defences are only real if something runs them.
#
# Two tests in particular exist solely to prevent a "green while
# testing nothing" failure and neither can run without this workflow:
# `mutants_are_not_stale_against_current_sulo` (the sole guard against
# every mutant in `mutants/` silently testing a frozen, stale copy of
# SULO) and
# `the_committed_golden_file_matches_clean_sulo` (the only thing in the
# repository that reads `suites/sulo.golden` at all).
#
# Both, and most of the rest of the suite, read real SULO at the
# hard-coded relative path `../sulo/sulo.ttl`, so the checkout below
# places the sulo repo as a SIBLING of this one. That is why this
# workflow checks out into `sulo-testharness/` rather than the default
# workspace root.
#
# Deliberately minimal: test, lint, format, and one real invocation of
# the binary. Release and publish infrastructure is deferred.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sulo-testharness

    steps:
      - name: Check out sulo-testharness
        uses: actions/checkout@v4
        with:
          path: sulo-testharness

      - name: Check out SULO as a sibling
        uses: actions/checkout@v4
        with:
          repository: AIDAVA-DEV/sulo
          path: sulo

      # rust-toolchain.toml pins 1.95.0 with rustfmt and clippy; naming
      # the version here too means a CI run cannot silently drift onto
      # whatever the runner image happens to ship.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sulo-testharness

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

      # No --accept-golden: this must COMPARE against the committed
      # golden file and fail on drift, never rewrite it. (`tests/cli.rs`
      # now covers `main.rs`, its argument parsing and its exit codes,
      # so this step is no longer the only thing exercising the binary.)
      - name: Golden closure
        run: cargo run -- golden --ontology ../sulo/sulo.ttl --golden suites/sulo.golden

[package]
name = "sulo-testharness"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Regression and competency-question test harness for the SULO ontology"

[dependencies]
# horned-owl is declared as a crates.io version here, then redirected to the
# pinned git rev by [patch.crates-io] below. This mirrors exactly how
# rustdl's own Cargo.toml resolves horned-owl (see its `[patch.crates-io]`
# section): rustdl's `owl-dl-reasoner` depends on crates.io `horned-owl =
# "1.4"`, and cargo only unifies a git dependency with a crates.io dependency
# on the SAME package if a patch rewrites the crates.io source to that exact
# git URL and rev. Pinning `horned-owl` directly to the git rev here instead
# (without the patch) resolves to a second, distinct copy of the crate,
# because owl-dl-reasoner's own crates.io reference is untouched, and
# `SetOntology` then becomes two incompatible types.
horned-owl = { version = "1.4", default-features = false }
# Pinned by REV, not by tag: a git tag is movable, so `tag = "v0.4.22"` could
# silently resolve to different code tomorrow, which for an oracle whose exact
# strength is baked into `suites/sulo.golden` is a correctness problem, not a
# hygiene one. This is the rev v0.4.22 pointed at, and the same form the
# [patch.crates-io] entry below already uses. Bumping it means also editing
# `golden::REASONER_VERSION` in the same commit; see that constant's doc.
owl-dl-reasoner = { git = "https://github.com/MaastrichtU-IDS/rustdl", rev = "a2acc23a9909c4f106886d246e755ede9fa05d9a" }
oxrdfio = "0.2.0"
oxrdf = "0.3.0"
# In-memory SPARQL store for the competency-question path (task 3). Verified:
# with default-features off this resolves to the SAME oxrdf 0.3.3 and
# oxrdfio 0.2.5 already pinned above, so there is exactly one `Term` type in
# the dependency tree; `cargo tree | grep oxrdf` confirms this. Default
# features pull in `oxrocksdb-sys`, a native RocksDB build this harness has
# no use for since `Store::new()` (in-memory) is all `materialize` needs.
oxigraph = { version = "0.5.9", default-features = false }
curie = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# The `--format json` payload. Built as a `serde_json::Value` tree rather
# than by string concatenation so that a verdict message containing a quote
# or a backslash cannot produce invalid JSON.
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
# Used only by tests/report.rs, to PARSE the JUnit output rather than grep
# it: an XML tree is what proves the escaping is correct, since a parser
# rejects the unescaped `<` a string search would happily find. roxmltree is
# dependency-free and decodes entities on read, so an assertion can compare a
# parsed text node against the original message.
roxmltree = "0.21"

[patch.crates-io]
# MUST match the rev rustdl pins, or SetOntology becomes two distinct types.
horned-owl = { git = "https://github.com/micheldumontier/horned-owl", rev = "b188edaf7c92600918f0524962d928097ecd6b4d" }

[lib]
name = "sulo_testharness"
path = "src/lib.rs"

[[bin]]
name = "sulo-testharness"
path = "src/main.rs"

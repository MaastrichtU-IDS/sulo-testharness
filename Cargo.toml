[package]
name = "sulo-testharness"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Regression and competency-question test harness for the SULO ontology"

[dependencies]
# horned-owl is declared as a crates.io version here, then redirected to the
# pinned git rev by [patch.crates-io] below. This mirrors exactly how
# rustdl's own Cargo.toml resolves horned-owl (see its `[patch.crates-io]`
# section): rustdl's `owl-dl-reasoner` depends on crates.io `horned-owl =
# "1.4"`, and cargo only unifies a git dependency with a crates.io dependency
# on the SAME package if a patch rewrites the crates.io source to that exact
# git URL and rev. Pinning `horned-owl` directly to the git rev here instead
# (without the patch) resolves to a second, distinct copy of the crate,
# because owl-dl-reasoner's own crates.io reference is untouched, and
# `SetOntology` then becomes two incompatible types.
horned-owl = { version = "1.4", default-features = false }
owl-dl-reasoner = { git = "https://github.com/MaastrichtU-IDS/rustdl", tag = "v0.4.22" }
oxrdfio = "0.2.0"
oxrdf = "0.3.0"
curie = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"

[patch.crates-io]
# MUST match the rev rustdl pins, or SetOntology becomes two distinct types.
horned-owl = { git = "https://github.com/micheldumontier/horned-owl", rev = "b188edaf7c92600918f0524962d928097ecd6b4d" }

[lib]
name = "sulo_testharness"
path = "src/lib.rs"

[[bin]]
name = "sulo-testharness"
path = "src/main.rs"
